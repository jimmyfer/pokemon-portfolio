<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon RPG Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #game-container {
            position: relative;
            image-rendering: pixelated;
        }

        #game-canvas {
            border: 2px solid #333;
        }

        .game-ui {
            position: absolute;
            pointer-events: none;
        }

        #dialogue-box {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- UI Overlays -->
        <div id="hud" class="game-ui"></div>
        <div id="dialogue-box" class="game-ui"></div>
        <div id="battle-ui" class="game-ui"></div>
        
        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
    </div>

    <script src="bundle.js"></script>
</body>
</html>
